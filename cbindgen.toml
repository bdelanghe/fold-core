# the native library's C header (include/fold_core.h, src/native.rs): regenerated by `cbindgen -c cbindgen.toml -o include/fold_core.h src/native.rs`,
# and checks.native-header fails if the committed one differs
language = "C"
include_guard = "FOLD_CORE_H"
no_includes = true
sys_includes = ["stdint.h"]
autogen_warning = "/* Generated by cbindgen from src/native.rs; do not edit. */"
documentation_style = "c99"
after_includes = """
/* The host defines this when the library is built without tzdb (packages.native): seconds east of UTC in the IANA zone
 * `zone` (`len` bytes of UTF-8) at `epoch_ms`, or INT32_MIN for a zone it does not know. */
int32_t fold_core_tz_offset(const uint8_t *zone, uintptr_t len, double epoch_ms);
"""

[export]
include = ["FoldCoreBuf"]

[fn]
args = "horizontal"
