# fold-core's CI: the flake's checks (cargo tests at byte parity with the goldens, clippy, the wasm module at parity) on every pull
# request and on main.
name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  flake-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - run: nix flake check -L
