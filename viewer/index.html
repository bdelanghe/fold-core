<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- Its files are beside it (view.js, the module, fonts/): opened as /fold, with no trailing slash, they would resolve one level up.
     So a directory opened without its slash goes to it with the slash, before anything relative loads. -->
<script>if (!/\/$|\.[^/]*$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);</script>
<!-- The data this viewer folds: one JSON document from a data origin the app is not served by (COGNITIVE-BROWSER-SDK-2026-10-30). -->
<meta name="fold-data" content="/fold-data/fleet/page.json" data-source="fleet-map">
<meta name="fold-live" content="/live" data-seat="personal-super-human">
<link rel="modulepreload" href="fold-core.js">
<!-- On the Home Screen (manifest.webmanifest, sw.js): the approved Basis mark, from ~/.lobby/ops/basis-icons (Bobby 910d8009). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Basis">
<meta name="theme-color" content="#EDEAE1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16221C" media="(prefers-color-scheme: dark)">
<title>Basis</title>
<!-- Its look, one stylesheet shared with every fold's pre-rendered page (src/page.rs links it as <base>fold.css). -->
<link rel="stylesheet" href="fold.css">
</head>
<body>
<form class="reading" role="search" aria-label="Reading"><label for="reading">Reading</label>
<input id="reading" name="data" type="search" spellcheck="false" autocomplete="off" aria-describedby="reading-note">
<button type="submit">Open</button><span id="reading-note" class="note"></span></form>
<!-- Said when the fold shown is a kept copy (its host did not answer): read with the fold's heading, which describes itself by it. -->
<p id="stale" class="stale" hidden></p>
<main><h1 tabindex="-1">Loading…</h1></main>
<script type="module">
// A fold viewer that holds no data: it fetches one JSON document from the data origin (the fold-data meta), folds it here with the
// core's WebAssembly module, and shows one fold at a time. The core gives each fold's accessibility tree (ax_json); fold-dom.js
// derives the DOM from that tree alone; this file only routes, follows the data and moves the cursor.
// Keys are Allie's (vim): j/k move, l or Enter goes in, h goes back out.
// As a deck (#slides/<path>, or a page whose folds say present "slides" opened with no path) the same fold is a slide: → and ← go to
// the next and previous slide in reading order; l or Enter still goes into the point under the cursor, h back out.
import { core } from "./fold-core.js";
import { toDom, liveLine } from "./fold-dom.js";
import { at, dataOf, docId, href as link, modeOf, open, pathOf, since, viewOf } from "./view.js";
const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
const meta = document.querySelector('meta[name="fold-data"]');
// The document read, always said in the Reading box: the meta's, or one named in the address by an absolute path on this site
// (?data=/fold-data/demo/page.json, as Open submits it). The box holds its path; the note says where it is from, or why it was not read.
const data = dataOf(location.search, location.href, { path: meta.content, source: meta.dataset.source });
document.getElementById("reading").value = data.path;
document.getElementById("reading-note").textContent = data.error ? `Not read: ${data.error}` : data.source ? `From ${data.source}` : "Named in the address";
let nodes = new Map(), said = "", node = null, cur = 0, cameFrom = null, last = [], kept = null;
// Kept (sw.js answered from its copy): the note says since when and how long ago, and the heading is described by it, so a screen
// reader hears it with the title as the page opens. Fresh again, it goes.
function stale() {
  const p = document.getElementById("stale"), h = document.querySelector("main h1");
  p.hidden = !kept; p.textContent = kept ? since(kept, new Date(), zone) : "";
  if (kept) h?.setAttribute("aria-describedby", "stale"); else h?.removeAttribute("aria-describedby");
}
const href = (p, m = modeOf(location.hash, node)) => link(p, m);
const rows = () => [...document.querySelectorAll("ol.rows > li.obj")]; // the child objects; property rows are read, not entered
function render(focus) {
  const v = viewOf(ax, nodes, location.hash, zone);
  node = v.node;
  const main = toDom(document, v.tree);
  document.querySelector("main").replaceWith(main);
  document.title = node?.title ?? "Basis";
  for (const li of rows()) li.addEventListener("click", e => { if (e.target.tagName !== "A") li.querySelector("a").click(); });
  // The fold's one action is a form (src/ax.rs act_form) and submits as one, with no script. Only where a capability host is
  // present (Allie's window.claude) does the submit go to it instead, its answer said in the row.
  const n = node, a = n?.act, f = main.querySelector("form.act"), say = t => main.querySelector(".result").textContent = t;
  if (f && a && window.claude?.use) f.addEventListener("submit", async e => {
    e.preventDefault();
    const b = f.querySelector("button"), c = await window.claude.use(a.cap).catch(() => null);
    if (!c) return say("Not available here.");
    b.disabled = true;
    try { const r = await c[a.call](a.args); say(r?.ok === false ? "Not done: " + r.reason : "Done. " + (r?.message ?? "")); }
    catch (e) { say(e?.code === "cancelled" ? "Cancelled." : "Not done: " + (e?.message ?? e?.code)); b.disabled = false; }
  });
  // Back out (h, ←, Backspace or the path) lands the cursor on the row you came from, as in Allie.
  const back = cameFrom == null ? -1 : (node?.kids ?? []).findIndex(k => k.id === cameFrom);
  if (back >= 0) { cur = back; cameFrom = null; }
  move(Math.min(cur, Math.max(0, rows().length - 1)));
  stale();
  if (focus) main.querySelector("h1").focus();
}
function move(i) {
  const rs = rows(); if (!rs.length) return;
  cur = Math.max(0, Math.min(rs.length - 1, i));
  rs.forEach((r, j) => r.classList.toggle("cur", j === cur));
}
function show(focus) {
  const p = pathOf(location.hash); cur = 0;
  cameFrom = last.length > p.length && p.every((x, i) => x === last[i]) ? last[p.length] : null;
  last = p;
  render(focus);
}
// The document, folded here. A failed read keeps the folds already shown; with none yet, the root says why.
async function load() {
  try {
    if (data.error) throw new Error(data.error);
    const next = await open(fold, data.url, { opts: (modified) => ({ ...(data.source ? { source: data.source } : {}), updated: modified ?? new Date().toISOString(), localTimeZone: zone }), stored: (at) => { kept = at; } });
    const text = JSON.stringify([...next]);
    if (text === said) { stale(); return false; }
    nodes = next; said = text; return true;
  } catch (e) {
    if (!nodes.size) nodes = new Map([["root", { title: "Could not read the data", trail: [], failed: `Could not read ${data.path}: ${e?.message ?? e}` }]]);
    return !said;
  }
}
addEventListener("pointerdown", () => document.body.classList.remove("keys"));
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
  const p = pathOf(location.hash), k = node?.kids ?? [], deck = modeOf(location.hash, node) === "slides";
  if (deck && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { const s = node?.[e.key === "ArrowRight" ? "next" : "prev"]; if (!s) return; location.hash = href(at(s.id)); }
  else if (e.key === "j" || e.key === "ArrowDown") move(cur + 1);
  else if (e.key === "k" || e.key === "ArrowUp") move(cur - 1);
  else if ((e.key === "l" || e.key === "Enter" || e.key === "ArrowRight") && k[cur]) location.hash = href(k[cur].href?.startsWith("#/") ? pathOf(k[cur].href) : [...p, k[cur].id]); // an in-page row ("back to the top") goes where it says, in the mode you are in
  else if ((e.key === "h" || e.key === "Backspace" || e.key === "ArrowLeft") && p.length) location.hash = href(p.slice(0, -1));
  else return;
  document.body.classList.add("keys");
  e.preventDefault();
});
addEventListener("hashchange", () => show(true));
// Offline: the shell and the last document read are kept (sw.js), so with the host asleep this page still opens on its last fold.
navigator.serviceWorker?.register("sw.js").catch(() => {});
const { fold, ax } = await core(await (await fetch("fold_core.wasm")).arrayBuffer());
await load();
// Allie's keys work on arrival: the first render focuses the title, so the page gets the arrow keys without a click first.
show(true);
document.body.dataset.ready = "1";
// The producer rewrites the document every few minutes: read it again each minute, and show a change in place (focus stays).
setInterval(async () => { if (await load()) render(false); }, 60_000);
// The live state (fold-live meta's stream) as the hint of its seat's row, never a line of its own (01M620P439). `snapshot` and
// `tick` (10 s) carry it all, `seat` one seat; a dropped stream reads as offline since the last tick.
const liveMeta = document.querySelector('meta[name="fold-live"]');
if (liveMeta?.content && liveMeta.dataset.seat && typeof EventSource === "function") {
  let snap = null, lastTick = null, down = null;
  const paint = () => {
    const a = [...document.querySelectorAll("ol.rows > li.obj > a")].find(x => x.textContent === liveMeta.dataset.seat);
    const hint = a && document.getElementById(a.getAttribute("aria-describedby") ?? "");
    if (!hint) return;
    const l = liveLine(snap, liveMeta.dataset.seat, Date.now(), down), t = `${l.state} ${l.age}`.trim();
    if (hint.textContent !== t) hint.textContent = t;
    hint.classList.toggle("alert", l.alert);
  };
  const whole = e => { try { snap = JSON.parse(e.data); lastTick = Date.now(); down = null; } catch {} paint(); };
  const es = new EventSource(liveMeta.content);
  es.addEventListener("snapshot", whole);
  es.addEventListener("tick", whole);
  es.addEventListener("seat", e => {
    try { const s = JSON.parse(e.data).state; if (snap && s?.seat) snap.seats = [...snap.seats.filter(x => x.seat !== s.seat), s]; } catch {}
    paint();
  });
  es.addEventListener("error", () => { if (es.readyState !== EventSource.OPEN && lastTick != null) down = lastTick; paint(); });
  setInterval(paint, 1000);
}
</script>
</body>
</html>
