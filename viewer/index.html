<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<!-- Its files are beside it (view.js, the module, fonts/): opened as /fold, with no trailing slash, they would resolve one level up.
     So a directory opened without its slash goes to it with the slash, before anything relative loads. -->
<script>if (!/\/$|\.[^/]*$/.test(location.pathname)) location.replace(location.pathname + "/" + location.search + location.hash);</script>
<!-- The data this viewer folds: one JSON document from a data origin the app is not served by (COGNITIVE-BROWSER-SDK-2026-10-30). -->
<meta name="fold-data" content="/fold-data/fleet/page.json" data-source="fleet-map">
<meta name="fold-live" content="/live" data-seat="personal-super-human">
<!-- Needs you, read live (src/needs.rs, BRIEF-stint-2026-11-02-approve-into-fold): fold serve's needs.json, beside this page, for the
     document whose source it names. Read on open, on going into Needs you, with each refresh and after each act on an intent. -->
<meta name="fold-needs" content="needs.json" data-source="fleet-map">
<!-- Clax, through @empathic/clax-sdk only (basis-clax goal): the instance's /_clax/overlay.js, as fold serve passes it through on
     this origin (clax/overlay.js, src/report.rs: the instance sends no CORS header, so a pinned script must be same-origin), with the
     SDK's version and the SRI digest of the instance's bytes. Never copied here. The version is the SDK's (clax Cargo.toml
     [workspace.package], 0.6.0); the digest is of /_clax/overlay.js as the running instance serves it: clax wip/bdelanghe
     818a674a, home pins/empathic/clax.json (/nix/store/ckw047…-clax-0.6.0), 141084 bytes, read from
     https://phobos.tail556f5b.ts.net/_clax/overlay.js on 2026-11-02 (the earlier pin was clax main d7812795's vite build, which no
     instance serves, so the overlay never mounted: RECOMMEND-consultant-2026-11-01-clax-sdk-in-basis.md). A mismatch fails closed.
     It goes stale when the home clax pin moves: re-pin from the deployed build (S2 derives it from the closure). -->
<meta name="clax-sdk" content="clax/overlay.js" data-version="0.6.0" data-integrity="sha384-HOmKT9h5Ol0a2IC6ZGJXXxo6Gnf5olfeyKNtVD8dhcCXEetJzsIwffcNRaYMPxxt">
<link rel="modulepreload" href="fold-core.js">
<!-- On the Home Screen (manifest.webmanifest, sw.js): the approved Basis mark, from ~/.lobby/ops/basis-icons (Bobby 910d8009). -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Basis">
<meta name="theme-color" content="#EDEAE1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#16221C" media="(prefers-color-scheme: dark)">
<title>Basis</title>
<!-- Its look, one stylesheet shared with every fold's pre-rendered page (src/page.rs links it as <base>fold.css). -->
<link rel="stylesheet" href="fold.css">
</head>
<body>
<!-- Said when the fold shown is a kept copy (its host did not answer): read with the fold's heading, which describes itself by it. -->
<p id="stale" class="stale" hidden></p>
<!-- What an act on an intent did (sign.js), when its item has gone and the fold you are on has no status line of its own: said once,
     cleared by the next move. A live region from the start, so it is heard when it is filled. -->
<p id="said" class="stale said" role="status"></p>
<main><h1 tabindex="-1">Loading…</h1></main>
<!-- The last region, after the fold (consultant's cold read, RECOMMEND-consultant-2026-11-01-fleet-page-cold-read.md point 6):
     a way to open another document when this one fails. Where the data is from is said on every fold ("Data from …", src/ax.rs). -->
<form class="reading" role="search" aria-label="Reading"><label for="reading">Reading</label>
<input id="reading" name="data" type="search" spellcheck="false" autocomplete="off" aria-describedby="reading-note">
<button type="submit">Open</button><span id="reading-note" class="note"></span></form>
<script type="module">
// A fold viewer that holds no data: it fetches one JSON document from the data origin (the fold-data meta), folds it here with the
// core's WebAssembly module, and shows one fold at a time. The core gives each fold's accessibility tree (ax_json); fold-dom.js
// derives the DOM from that tree alone; this file only routes, follows the data and moves the cursor.
// Keys are Allie's (vim): j/k move, l or Enter goes in, h goes back out; ]] and [[ go to the next and previous fold beside this one
// (the next group from a group, the next item from an item: vim's section motions); Enter on a fold with no rows to go into runs its
// first act (a Needs-you item's Approve, or its ack): the rotor's first action. Decline is the item's second act, its own button.
// As a deck (#slides/<path>, or a page whose folds say present "slides" opened with no path) the same fold is a slide: → and ← go to
// the next and previous slide in reading order; l or Enter still goes into the point under the cursor, h back out.
import { core } from "./fold-core.js";
import { toDom, liveLine } from "./fold-dom.js";
import { at, beside, dataOf, docId, haecceityOf, href as link, modeOf, open, pathOf, since, viewOf } from "./view.js";
import { ENDPOINTS, intentOk, notifyHere, readNeeds, sign } from "./sign.js";
import { embed } from "./clax.js";
const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
const meta = document.querySelector('meta[name="fold-data"]');
// The document read, always said in the Reading box: the meta's, or one named in the address by an absolute path on this site
// (?data=/fold-data/demo/page.json, as Open submits it). The box holds its path; the note says why it was not read, or that the address
// named it. Its source is not said here: every fold says "Data from <source>, <when>" (src/ax.rs).
const data = dataOf(location.search, location.href, { path: meta.content, source: meta.dataset.source });
document.getElementById("reading").value = data.path;
document.getElementById("reading-note").textContent = data.error ? `Not read: ${data.error}` : data.source ? "" : "Named in the address";
let nodes = new Map(), said = "", node = null, cur = 0, cameFrom = null, last = [], kept = null, clax = null, claxAt = null;
// Needs you, live: needs.json's URL for the document it is for (none for one named in the address), and its last answer.
const needsMeta = document.querySelector('meta[name="fold-needs"]');
const needsUrl = needsMeta?.content && data.source && data.source === needsMeta.dataset.source ? new URL(needsMeta.content, location.href).href : null;
let live = null, told = null, keyAt = { key: "", t: 0 };
// Kept (sw.js answered from its copy): the note says since when and how long ago, and the heading is described by it, so a screen
// reader hears it with the title as the page opens. Fresh again, it goes.
function stale() {
  const p = document.getElementById("stale"), h = document.querySelector("main h1");
  p.hidden = !kept; p.textContent = kept ? since(kept, new Date(), zone) : "";
  if (kept) h?.setAttribute("aria-describedby", "stale"); else h?.removeAttribute("aria-describedby");
}
const href = (p, m = modeOf(location.hash, node)) => link(p, m);
const rows = () => [...document.querySelectorAll("ol.rows > li.obj")]; // the child objects; property rows are read, not entered
function render(focus) {
  // Each row carries its thing's haecceity (schema:about), from the document's source: what a Clax report is about.
  const v = viewOf(ax, nodes, location.hash, zone, data.source);
  node = v.node;
  const main = toDom(document, v.tree);
  document.querySelector("main").replaceWith(main);
  // Clax says the fold in view: reopened with its haecceity and its rows' (clax.js embed), never left on the last fold.
  if (clax?.mounted && v.path.join("/") !== claxAt) { claxAt = v.path.join("/"); clax.reopen(); }
  document.title = node?.title ?? "Basis";
  for (const li of rows()) li.addEventListener("click", e => { if (e.target.tagName !== "A") li.querySelector("a").click(); });
  // A fold's acts are forms (src/ax.rs act_form) and submit as forms, natively, in every host, Allie's too: no script takes
  // them (allie-lead 968825b4). fold serve answers the post (src/serve.rs).
  // Back out (h, ←, Backspace or the path) lands the cursor on the row you came from, as in Allie.
  const back = cameFrom == null ? -1 : (node?.kids ?? []).findIndex(k => k.id === cameFrom);
  if (back >= 0) { cur = back; cameFrom = null; }
  move(Math.min(cur, Math.max(0, rows().length - 1)));
  stale();
  if (focus) main.querySelector("h1").focus();
}
function move(i) {
  const rs = rows(); if (!rs.length) return;
  cur = Math.max(0, Math.min(rs.length - 1, i));
  rs.forEach((r, j) => r.classList.toggle("cur", j === cur));
}
function show(focus) {
  const p = pathOf(location.hash); cur = 0;
  cameFrom = last.length > p.length && p.every((x, i) => x === last[i]) ? last[p.length] : null;
  last = p;
  render(focus);
  document.getElementById("said").textContent = told ?? ""; told = null;
}
// The document, folded here. A failed read keeps the folds already shown; with none yet, the root says why.
async function load() {
  try {
    if (data.error) throw new Error(data.error);
    // read beside the document, so it is folded with what waits now: never the producer's sign items (src/needs.rs overlay). Both
    // at once, so a host asleep costs the one wait, not two.
    const reading = needsUrl ? readNeeds(needsUrl) : null;
    const next = await open(fold, data.url, { root: reading ? async (root) => { live = await reading; return needs({ root, ...live, now: Date.now() }); } : undefined, opts: (modified) => ({ ...(data.source ? { source: data.source } : {}), updated: modified ?? new Date().toISOString(), localTimeZone: zone }), stored: (at) => { kept = at; } });
    const text = JSON.stringify([...next]);
    if (text === said) { stale(); return false; }
    nodes = next; said = text; return true;
  } catch (e) {
    if (!nodes.size) nodes = new Map([["root", { title: "Could not read the data", trail: [], failed: `Could not read ${data.path}: ${e?.message ?? e}` }]]);
    return !said;
  }
}
addEventListener("pointerdown", () => document.body.classList.remove("keys"));
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || /input|textarea/i.test(e.target.tagName)) return;
  if (e.key === "Enter" && /^(a|button|select)$/i.test(e.target.tagName)) return; // it does its own thing, once
  const p = pathOf(location.hash), k = node?.kids ?? [], deck = modeOf(location.hash, node) === "slides";
  const twice = (key) => { const again = keyAt.key === key && performance.now() - keyAt.t < 800; keyAt = again ? { key: "", t: 0 } : { key, t: performance.now() }; return again; };
  const act = !k.length && e.key === "Enter" ? document.querySelector("main form.act") : null;
  if (e.key === "]" || e.key === "[") { const to = twice(e.key) && beside(nodes, p, e.key === "]" ? 1 : -1); if (to) location.hash = href(to); }
  else if (act) act.requestSubmit();
  else if (deck && (e.key === "ArrowRight" || e.key === "ArrowLeft")) { const s = node?.[e.key === "ArrowRight" ? "next" : "prev"]; if (!s) return; location.hash = href(at(s.id)); }
  else if (e.key === "j" || e.key === "ArrowDown") move(cur + 1);
  else if (e.key === "k" || e.key === "ArrowUp") move(cur - 1);
  else if ((e.key === "l" || e.key === "Enter" || e.key === "ArrowRight") && k[cur]) location.hash = href(k[cur].href?.startsWith("#/") ? pathOf(k[cur].href) : [...p, k[cur].id]); // an in-page row ("back to the top") goes where it says, in the mode you are in
  else if ((e.key === "h" || e.key === "Backspace" || e.key === "ArrowLeft") && p.length) location.hash = href(p.slice(0, -1));
  else return;
  document.body.classList.add("keys");
  e.preventDefault();
});
addEventListener("hashchange", () => {
  show(true);
  // going into Needs you reads what waits again, and shows a change in place
  if (needsUrl && pathOf(location.hash)[0] === "needs") load().then((changed) => { if (changed) render(false); });
});
// An act on an intent (src/ax.rs act_form: data-intent, data-call), taken here; every other act submits natively (allie-lead 968825b4).
// Both are passkey verdicts (BRIEF addendum 1), run against chitin-approve (sign.js), their words from the challenge. Either way, what
// waits is read again, and an item that has gone takes you back to its group, where what was done is said.
document.addEventListener("submit", async (e) => {
  const f = e.target, id = f?.dataset?.intent, call = f?.dataset?.call;
  // Notify me on this device, or stop (BRIEF addendum 2): only a page can ask the browser, so the script takes it; said in the fold's status line.
  if (f?.dataset?.push) {
    e.preventDefault();
    if (f.getAttribute("aria-busy") === "true") return;
    f.setAttribute("aria-busy", "true");
    const r = await notifyHere(f.dataset.push, location.href);
    f.removeAttribute("aria-busy");
    const s = document.getElementById("did"); if (s) s.textContent = r.said;
    return;
  }
  if (!id) return;
  e.preventDefault();
  if (!intentOk(id) || f.getAttribute("aria-busy") === "true") return;
  const at = pathOf(location.hash), tell = (m) => { const s = document.getElementById("did"); if (s) s.textContent = m; };
  f.setAttribute("aria-busy", "true");
  let r;
  if (Object.hasOwn(ENDPOINTS, call)) {
    const shown = (live?.needs?.waiting ?? []).find((w) => w.id === id);
    r = shown ? await sign(id, call, { to: shown.to, text: shown.text }, { say: tell }) : { ok: false, changed: true, said: "Nothing was signed: this isn't waiting for you now." };
  } else { f.removeAttribute("aria-busy"); return; }
  f.removeAttribute("aria-busy");
  if (!r.ok && !r.changed) { tell(r.said); return; }
  await load();
  if (nodes.has(docId(at))) { render(false); tell(r.said); return; }
  // the nearest fold still there: its group, or Needs you when that was the group's last item
  let up = at.slice(0, -1);
  while (up.length && !nodes.has(docId(up))) up = up.slice(0, -1);
  told = r.said;
  location.hash = href(up);
});
// Offline: the shell and the last document read are kept (sw.js), so with the host asleep this page still opens on its last fold.
navigator.serviceWorker?.register("sw.js").catch(() => {});
const { fold, ax, needs } = await core(await (await fetch("fold_core.wasm")).arrayBuffer());
await load();
// Allie's keys work on arrival: the first render focuses the title, so the page gets the arrow keys without a click first.
show(true);
document.body.dataset.ready = "1";
// Clax, once the fold is up and never ahead of it: the pinned overlay, mounted only where fold serve mints this reader a token.
// It is told the fold in view: its haecceity (null for a document named in the address) and its rows.
embed({ at: () => ({ fold: data.source ? haecceityOf(data.source, pathOf(location.hash)) : null, rows: rows() }) })
  .then((r) => { clax = r; claxAt = pathOf(location.hash).join("/"); document.body.dataset.clax = r.mounted ? "on" : r.why; })
  .catch((e) => { document.body.dataset.clax = `failed: ${e?.message ?? e}`; });
// The producer rewrites the document every few minutes: read it again each minute, and show a change in place (focus stays).
setInterval(async () => { if (await load()) render(false); }, 60_000);
// The live state (fold-live meta's stream) as the hint of its seat's row, never a line of its own (01M620P439). `snapshot` and
// `tick` (10 s) carry it all, `seat` one seat; a dropped stream reads as offline since the last tick.
const liveMeta = document.querySelector('meta[name="fold-live"]');
if (liveMeta?.content && liveMeta.dataset.seat && typeof EventSource === "function") {
  let snap = null, lastTick = null, down = null;
  const paint = () => {
    const a = [...document.querySelectorAll("ol.rows > li.obj > a")].find(x => x.textContent === liveMeta.dataset.seat);
    const hint = a && document.getElementById(a.getAttribute("aria-describedby") ?? "");
    if (!hint) return;
    const l = liveLine(snap, liveMeta.dataset.seat, Date.now(), down), t = `${l.state} ${l.age}`.trim();
    if (hint.textContent !== t) hint.textContent = t;
    hint.classList.toggle("alert", l.alert);
  };
  const whole = e => { try { snap = JSON.parse(e.data); lastTick = Date.now(); down = null; } catch {} paint(); };
  const es = new EventSource(liveMeta.content);
  es.addEventListener("snapshot", whole);
  es.addEventListener("tick", whole);
  es.addEventListener("seat", e => {
    try { const s = JSON.parse(e.data).state; if (snap && s?.seat) snap.seats = [...snap.seats.filter(x => x.seat !== s.seat), s]; } catch {}
    paint();
  });
  es.addEventListener("error", () => { if (es.readyState !== EventSource.OPEN && lastTick != null) down = lastTick; paint(); });
  setInterval(paint, 1000);
}
</script>
</body>
</html>
