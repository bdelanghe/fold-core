[package]
name = "fold-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The shared fold core: one JSON object (pages, decks, Markdown) into fold-viewer nodes, byte-identical to the fold viewer it was ported from"
repository = "https://github.com/bdelanghe/fold-core"

[lib]
crate-type = ["rlib", "cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[features]
# the zone rules built in (chrono-tz); without it, the WebAssembly host gives them (src/tz.rs)
default = ["tzdb"]
tzdb = ["dep:chrono-tz"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = { version = "0.10", optional = true }
sha2 = { version = "0.10", default-features = false }
